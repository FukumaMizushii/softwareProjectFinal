# ===============================
# = PROFILE ACTIVATION SWITCH
# ===============================
# Change this to "prod" to test production settings locally,
# or leave as "dev" for standard local development.
spring.profiles.active=dev

# ===============================
# = COMMON CONFIGURATIONS (Applies to both Dev and Prod)
# ===============================
server.port=8080

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
file.upload-dir=uploads

# JPA Shared Settings
spring.jpa.open-in-view=false

# Seed Admin Account
app.admin.email=admin@ebook.com
app.admin.password=admin123
app.admin.name=System Administrator