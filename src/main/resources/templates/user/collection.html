<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('My Collection')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <h3>My Collection</h3>

    <!-- COMMAND pattern: undo the last add/remove action -->
    <form th:if="${canUndo}" th:action="@{/collection/undo}" method="post" class="mb-3">
        <button class="btn btn-sm btn-outline-secondary" type="submit">
            <i class="bi bi-arrow-counterclockwise"></i> Undo last change
        </button>
    </form>

    <div th:if="${#lists.isEmpty(books)}" class="alert alert-info mt-3">
        Your collection is empty. Browse <a th:href="@{/books}">books</a> and add some favorites!
    </div>

    <div class="row g-4 mt-1">
        <div class="col-sm-6 col-md-4 col-lg-3" th:each="book : ${books}">
            <div class="card book-card shadow-sm">
                <a th:href="@{/books/{id}(id=${book.id})}">
                    <img th:if="${book.coverImagePath != null}"
                         th:src="@{/covers/{name}(name=${#strings.replace(book.coverImagePath,'covers/','')})}"
                         class="card-img-top book-cover" alt="cover">
                    <div th:unless="${book.coverImagePath != null}" class="book-cover-placeholder">
                        <i class="bi bi-book"></i>
                    </div>
                </a>
                <div class="card-body d-flex flex-column">
                    <h6 th:text="${book.title}">Title</h6>
                    <p class="text-muted small" th:text="'by ' + ${book.author}">Author</p>
                    <div class="mt-auto">
                        <a th:href="@{/books/{id}(id=${book.id})}"
                           class="btn btn-sm btn-primary">View</a>
                        <form class="d-inline"
                              th:action="@{/collection/remove/{id}(id=${book.id})}" method="post">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
