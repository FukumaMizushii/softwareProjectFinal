<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('Oops! - BookVault')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="error-page">
    <div>
        <i class="bi bi-exclamation-triangle-fill error-icon"></i>
        <h2 class="gradient-text">Something went wrong</h2>
        <p th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again or return home.'">Error</p>
        <div class="d-flex gap-3 justify-content-center">
            <a th:href="@{/}" class="btn btn-primary" id="errorHomeBtn">
                <i class="bi bi-house me-2"></i>Back to Home
            </a>
            <button onclick="history.back()" class="btn btn-secondary" id="errorBackBtn">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </button>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
