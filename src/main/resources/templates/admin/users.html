<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('Manage Users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <h3>Manage Users</h3>

    <div class="table-responsive mt-3">
        <table class="table table-hover align-middle bg-white">
            <thead class="table-dark">
            <tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.name}">Name</td>
                <td th:text="${u.email}">email</td>
                <td th:text="${u.phone} ?: '-'">phone</td>
                <td>
                    <span class="badge"
                          th:classappend="${u.role.name() == 'ADMIN'} ? ' bg-danger' : ' bg-primary'"
                          th:text="${u.role}">ROLE</span>
                </td>
                <td class="text-end">
                    <form class="d-inline" th:action="@{/admin/users/delete/{id}(id=${u.id})}"
                          method="post" onsubmit="return confirm('Delete this user?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit"
                                th:disabled="${u.role.name() == 'ADMIN'}">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
