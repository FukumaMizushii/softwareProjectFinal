<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('Book Form - BookVault')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4 mb-5" style="max-width: 760px;">

    <div class="d-flex align-items-center gap-3 mb-4 animate-fade-up">
        <a th:href="@{/admin/books}" class="btn btn-secondary btn-sm" id="cancelTopBtn">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h3 class="mb-0" th:text="${editMode} ? 'Edit Book' : 'Add New Book'">Book Form</h3>
            <p style="color:var(--clr-text-muted); font-size:0.85rem; margin:0;">
                Fill in the details below and upload files
            </p>
        </div>
    </div>

    <!-- The action URL differs for add vs edit. enctype required for file upload. -->
    <form th:action="${editMode}
                     ? @{/admin/books/edit/{id}(id=${bookDto.id})}
                     : @{/admin/books/add}"
          th:object="${bookDto}" method="post" enctype="multipart/form-data"
          class="card p-4 animate-fade-up-1" id="bookFormEl">

        <!-- Title & Author row -->
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label class="form-label" for="bookTitle">
                    <i class="bi bi-type me-1"></i>Title
                </label>
                <input type="text" th:field="*{title}" id="bookTitle" class="form-control"
                       placeholder="Book title...">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}"
                     th:errors="*{title}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="bookPrice">
                    <i class="bi bi-currency-dollar me-1"></i>Price
                </label>
                <input type="number" step="0.01" th:field="*{price}" id="bookPrice" class="form-control"
                       placeholder="Leave blank for free">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}"
                     th:errors="*{price}"></div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-7">
                <label class="form-label" for="bookAuthor">
                    <i class="bi bi-person me-1"></i>Author
                </label>
                <input type="text" th:field="*{author}" id="bookAuthor" class="form-control"
                       placeholder="Author name...">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('author')}"
                     th:errors="*{author}"></div>
            </div>
            <div class="col-md-5">
                <label class="form-label" for="bookCategory">
                    <i class="bi bi-tags me-1"></i>Category
                </label>
                <select th:field="*{categoryId}" id="bookCategory" class="form-select">
                    <option value="">— Select category —</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}" th:text="${cat.categoryName}">Cat</option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('categoryId')}"
                     th:errors="*{categoryId}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="bookDescription">
                <i class="bi bi-text-paragraph me-1"></i>Description
            </label>
            <textarea th:field="*{description}" id="bookDescription" class="form-control" rows="4"
                      placeholder="A short synopsis of the book..."></textarea>
        </div>

        <!-- Keep existing file paths across an edit if no new upload -->
        <input type="hidden" th:field="*{existingFilePath}">
        <input type="hidden" th:field="*{existingCoverImagePath}">

        <!-- File uploads -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label" for="bookFilePicker">
                    <i class="bi bi-file-earmark-pdf me-1" style="color:#ef4444;"></i>Book File (PDF)
                </label>
                <div class="file-upload-area" id="bookFileArea">
                    <input type="file" name="bookFile" id="bookFilePicker" accept="application/pdf">
                    <i class="bi bi-cloud-upload upload-icon"></i>
                    <span class="upload-label">Click or drag a PDF here</span>
                    <span id="bookFileNameLabel" style="display:block; margin-top:0.25rem; font-size:0.8rem; color:#a78bfa;"></span>
                </div>
                <small class="text-muted" th:if="${editMode}">Leave empty to keep current file.</small>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="coverImagePicker">
                    <i class="bi bi-image me-1" style="color:#06b6d4;"></i>Cover Image
                </label>
                <div class="file-upload-area" id="coverImageArea">
                    <input type="file" name="coverImage" id="coverImagePicker" accept="image/*"
                           onchange="previewCover(this)">
                    <i class="bi bi-image upload-icon" id="coverUploadIcon"></i>
                    <span class="upload-label" id="coverUploadLabel">Click or drag an image here</span>
                    <img id="coverPreview" style="display:none; max-height:80px; border-radius:8px; margin-top:0.5rem;" alt="preview">
                </div>
                <small class="text-muted" th:if="${editMode}">Leave empty to keep current cover.</small>
            </div>
        </div>

        <!-- Action buttons -->
        <div class="d-flex gap-2 pt-2" style="border-top:1px solid rgba(255,255,255,0.07);">
            <button type="submit" class="btn btn-primary" id="saveBookBtn">
                <i class="bi bi-check-lg me-2"></i>Save Book
            </button>
            <a th:href="@{/admin/books}" class="btn btn-secondary" id="cancelBookBtn">
                <i class="bi bi-x-lg me-2"></i>Cancel
            </a>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Show selected PDF filename
    document.getElementById('bookFilePicker').addEventListener('change', function() {
        var label = document.getElementById('bookFileNameLabel');
        label.textContent = this.files.length > 0 ? this.files[0].name : '';
    });

    // Preview cover image
    function previewCover(input) {
        var preview = document.getElementById('coverPreview');
        var icon = document.getElementById('coverUploadIcon');
        var lbl = document.getElementById('coverUploadLabel');
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                icon.style.display = 'none';
                lbl.textContent = input.files[0].name;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
