<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <!-- Shared <head>: reusable via th:fragment -->
    <th:block th:fragment="commonHead(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title}">E-book Management System</title>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <!-- Custom Styles -->
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </th:block>
</head>

<body>

    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-book-half"></i> BookVault
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                    aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/books}"><i class="bi bi-grid me-1"></i>Browse</a>
                    </li>
                </ul>

                <!-- Search box -->
                <form class="d-flex me-3" th:action="@{/books/search}" method="get">
                    <div class="input-group" style="min-width:200px;">
                        <input class="form-control form-control-sm" type="search" name="keyword"
                               id="navSearchInput"
                               placeholder="Search books...">
                        <button class="btn btn-outline-light btn-sm" type="submit" id="navSearchBtn">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>

                <ul class="navbar-nav align-items-center gap-1">
                    <!-- Not logged in -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/register}"><i class="bi bi-person-plus me-1"></i>Register</a>
                    </li>

                    <!-- Admin links -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="bi bi-shield-check me-1"></i>Admin
                        </a>
                    </li>

                    <!-- User links -->
                    <li class="nav-item" sec:authorize="hasRole('USER')">
                        <a class="nav-link" th:href="@{/user/dashboard}">
                            <i class="bi bi-person-circle me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/collection}">
                            <i class="bi bi-heart me-1"></i>Collection
                        </a>
                    </li>

                    <!-- Logout -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-outline-light btn-logout ms-2" type="submit" id="logoutBtn">
                                <i class="bi bi-box-arrow-right me-1"></i>Logout
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         FOOTER
         ============================================================ -->
    <footer th:fragment="footer" class="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 text-center text-md-start mb-3 mb-md-0">
                    <span class="footer-brand"><i class="bi bi-book-half me-2"></i>BookVault</span>
                    <p class="mb-0 mt-1" style="font-size:0.8rem; color:var(--clr-text-muted);">
                        Your digital library, always open.
                    </p>
                </div>
                <div class="col-md-4 text-center mb-3 mb-md-0">
                    <small>&copy; 2025 E-book Management System &middot; Built with <i class="bi bi-heart-fill text-danger"></i> &amp; Spring Boot</small>
                </div>
                <div class="col-md-4 text-center text-md-end">
                    <a th:href="@{/}" class="me-3"><i class="bi bi-house"></i></a>
                    <a th:href="@{/books}" class="me-3"><i class="bi bi-grid"></i></a>
                    <a th:href="@{/login}"><i class="bi bi-person"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scroll to top button fragment -->
    <th:block th:fragment="scrollTop">
        <button class="scroll-top-btn" id="scrollTopBtn" title="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
            <i class="bi bi-arrow-up"></i>
        </button>
        <script>
            (function(){
                var btn = document.getElementById('scrollTopBtn');
                window.addEventListener('scroll', function(){
                    btn.classList.toggle('visible', window.scrollY > 300);
                });
            })();
        </script>
    </th:block>

</body>

</html>
