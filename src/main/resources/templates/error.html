<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-5 text-center">
    <i class="bi bi-exclamation-triangle text-warning" style="font-size:4rem;"></i>
    <h3 class="mt-3">Something went wrong</h3>
    <p class="text-muted" th:text="${errorMessage} ?: 'An unexpected error occurred.'">Error</p>
    <a th:href="@{/}" class="btn btn-primary">Back to Home</a>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
