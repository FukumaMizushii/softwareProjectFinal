<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('My Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <h3>Welcome, <span th:text="${currentUser.name}">User</span>!</h3>
    <p class="text-muted" th:text="${currentUser.email}">email</p>

    <div class="row g-4 mt-2">
        <div class="col-md-4">
            <div class="card dashboard-stat stat-books p-4 text-center">
                <i class="bi bi-heart-fill fs-1"></i>
                <h2 th:text="${collectionCount}">0</h2>
                <p class="mb-0">Books in My Collection</p>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-4 h-100">
                <h5>Quick Links</h5>
                <a th:href="@{/books}" class="btn btn-outline-primary mb-2">Browse All Books</a>
                <a th:href="@{/collection}" class="btn btn-outline-danger mb-2">My Collection</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
