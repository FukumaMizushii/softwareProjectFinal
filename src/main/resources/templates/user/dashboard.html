<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('My Dashboard - BookVault')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- Welcome banner -->
<div style="padding:2.5rem 0 1rem; background:linear-gradient(180deg, rgba(124,58,237,0.08) 0%, transparent 100%);">
    <div class="container">
        <div class="d-flex align-items-center gap-4 flex-wrap">
            <!-- Avatar initial -->
            <div style="width:72px; height:72px; border-radius:50%;
                        background:linear-gradient(135deg,#7c3aed,#3b82f6);
                        display:flex; align-items:center; justify-content:center;
                        font-family:'Outfit',sans-serif; font-size:2rem; font-weight:800;
                        color:#fff; flex-shrink:0; box-shadow:0 0 30px rgba(124,58,237,0.4);"
                 th:text="${#strings.substring(currentUser.name, 0, 1).toUpperCase()}">U</div>
            <div>
                <p style="color:var(--clr-text-muted); font-size:0.85rem; margin:0;">Welcome back,</p>
                <h2 style="font-family:'Outfit',sans-serif; font-size:2rem; font-weight:800; margin:0;"
                    th:text="${currentUser.name}">User Name</h2>
                <p style="color:var(--clr-text-muted); font-size:0.85rem; margin:0;"
                   th:text="${currentUser.email}">email@example.com</p>
            </div>
        </div>
    </div>
</div>

<div class="container mt-4 mb-5">
    <div class="row g-4">

        <!-- Stat card: Collection count -->
        <div class="col-md-4 animate-fade-up">
            <div class="card dashboard-stat stat-collection p-4 text-center">
                <i class="bi bi-heart-fill fs-1"></i>
                <h2 th:text="${collectionCount}">0</h2>
                <p class="mb-0">Books in My Collection</p>
            </div>
        </div>

        <!-- Quick Links card -->
        <div class="col-md-8 animate-fade-up-1">
            <div class="card p-4 h-100">
                <h5 class="section-heading">Quick Links</h5>
                <div class="d-flex flex-column gap-2 mt-3">
                    <a th:href="@{/books}" class="quick-link-tile" id="dashBrowseBtn">
                        <i class="bi bi-grid-3x3-gap-fill"></i>
                        <span>Browse All Books</span>
                        <i class="bi bi-chevron-right arrow"></i>
                    </a>
                    <a th:href="@{/collection}" class="quick-link-tile" id="dashCollectionBtn">
                        <i class="bi bi-heart-fill" style="color:#ec4899;"></i>
                        <span>My Collection</span>
                        <i class="bi bi-chevron-right arrow"></i>
                    </a>
                    <a th:href="@{/books/search?keyword=}" class="quick-link-tile" id="dashSearchBtn">
                        <i class="bi bi-search" style="color:#60a5fa;"></i>
                        <span>Search Books</span>
                        <i class="bi bi-chevron-right arrow"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Info card -->
        <div class="col-12 animate-fade-up-2">
            <div class="card p-4">
                <h5 class="section-heading mb-3">Account Info</h5>
                <div class="row g-3">
                    <div class="col-sm-4">
                        <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:1rem;">
                            <p style="color:var(--clr-text-muted); font-size:0.78rem; margin:0 0 0.25rem; text-transform:uppercase; letter-spacing:0.5px;">Name</p>
                            <p style="font-weight:600; margin:0;" th:text="${currentUser.name}">-</p>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:1rem;">
                            <p style="color:var(--clr-text-muted); font-size:0.78rem; margin:0 0 0.25rem; text-transform:uppercase; letter-spacing:0.5px;">Email</p>
                            <p style="font-weight:600; margin:0; word-break:break-all;" th:text="${currentUser.email}">-</p>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:1rem;">
                            <p style="color:var(--clr-text-muted); font-size:0.78rem; margin:0 0 0.25rem; text-transform:uppercase; letter-spacing:0.5px;">Phone</p>
                            <p style="font-weight:600; margin:0;" th:text="${currentUser.phone} ?: 'Not provided'">-</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scrollTop}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
