<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('Admin Dashboard - BookVault')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- Admin header bar -->
<div style="padding:2.5rem 0 1rem; background:linear-gradient(180deg, rgba(124,58,237,0.1) 0%, transparent 100%);">
    <div class="container">
        <div class="d-flex align-items-center gap-3">
            <div style="width:50px; height:50px; border-radius:12px;
                        background:linear-gradient(135deg,#7c3aed,#3b82f6);
                        display:flex; align-items:center; justify-content:center;
                        box-shadow:0 0 20px rgba(124,58,237,0.4);">
                <i class="bi bi-shield-check" style="color:#fff; font-size:1.4rem;"></i>
            </div>
            <div>
                <h2 class="section-heading mb-0">Admin Dashboard</h2>
                <p style="color:var(--clr-text-muted); font-size:0.85rem; margin:0;">
                    System overview &amp; management
                </p>
            </div>
        </div>
    </div>
</div>

<div class="container mt-4 mb-5">

    <!-- Stats row -->
    <div class="row g-4 animate-fade-up">
        <div class="col-md-4">
            <div class="card dashboard-stat stat-books p-4 text-center">
                <i class="bi bi-book fs-1"></i>
                <h2 th:text="${bookCount}">0</h2>
                <p class="mb-0">Total Books</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-stat stat-categories p-4 text-center">
                <i class="bi bi-tags fs-1"></i>
                <h2 th:text="${categoryCount}">0</h2>
                <p class="mb-0">Categories</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-stat stat-users p-4 text-center">
                <i class="bi bi-people fs-1"></i>
                <h2 th:text="${userCount}">0</h2>
                <p class="mb-0">Registered Users</p>
            </div>
        </div>
    </div>

    <!-- Management tiles -->
    <div class="card mt-4 p-4 animate-fade-up-1">
        <h5 class="section-heading mb-3">Management</h5>
        <div class="d-flex flex-column gap-2">
            <a th:href="@{/admin/books}" class="quick-link-tile" id="adminManageBooksBtn">
                <i class="bi bi-book-fill" style="color:#a78bfa;"></i>
                <div>
                    <span>Manage Books</span>
                    <small style="display:block; color:var(--clr-text-muted); font-size:0.78rem;" th:text="${bookCount} + ' books'"></small>
                </div>
                <i class="bi bi-chevron-right arrow"></i>
            </a>
            <a th:href="@{/admin/books/add}" class="quick-link-tile" id="adminAddBookBtn">
                <i class="bi bi-plus-circle-fill" style="color:#34d399;"></i>
                <div>
                    <span>Add New Book</span>
                    <small style="display:block; color:var(--clr-text-muted); font-size:0.78rem;">Upload PDF &amp; cover</small>
                </div>
                <i class="bi bi-chevron-right arrow"></i>
            </a>
            <a th:href="@{/admin/categories}" class="quick-link-tile" id="adminCategoriesBtn">
                <i class="bi bi-tags-fill" style="color:#f97316;"></i>
                <div>
                    <span>Manage Categories</span>
                    <small style="display:block; color:var(--clr-text-muted); font-size:0.78rem;" th:text="${categoryCount} + ' categories'"></small>
                </div>
                <i class="bi bi-chevron-right arrow"></i>
            </a>
            <a th:href="@{/admin/users}" class="quick-link-tile" id="adminUsersBtn">
                <i class="bi bi-people-fill" style="color:#0ea5e9;"></i>
                <div>
                    <span>Manage Users</span>
                    <small style="display:block; color:var(--clr-text-muted); font-size:0.78rem;" th:text="${userCount} + ' users'"></small>
                </div>
                <i class="bi bi-chevron-right arrow"></i>
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scrollTop}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
