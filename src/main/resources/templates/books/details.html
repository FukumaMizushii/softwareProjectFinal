<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{fragments/layout :: commonHead('Book Details - BookVault')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Gradient hero bar behind book details -->
    <div style="height:6px; background:linear-gradient(90deg, var(--clr-accent-1), var(--clr-accent-3), var(--clr-teal));"></div>

    <div class="container mt-4 mb-5">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb" style="background:transparent; padding:0;">
                <li class="breadcrumb-item">
                    <a th:href="@{/}" style="color:var(--clr-text-muted);">
                        <i class="bi bi-house me-1"></i>Home
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a th:href="@{/books}" style="color:var(--clr-text-muted);">Books</a>
                </li>
                <li class="breadcrumb-item active" style="color:var(--clr-text-muted);"
                    th:text="${book.title}">Book Title</li>
            </ol>
        </nav>

        <div class="row g-4">
            <!-- Cover Image -->
            <div class="col-md-4 mb-3 book-details-cover animate-fade-up">
                <img th:if="${book.coverImagePath != null}"
                     th:src="@{/covers/{name}(name=${#strings.replace(book.coverImagePath,'covers/','')})}"
                     class="img-fluid rounded shadow" alt="cover"
                     style="border-radius:var(--radius-lg) !important; box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.08) !important; width:100%;">
                <div th:unless="${book.coverImagePath != null}"
                     class="book-cover-placeholder rounded"
                     style="height:380px; border-radius:var(--radius-lg);">
                    <i class="bi bi-book"></i>
                </div>
            </div>

            <!-- Details Panel -->
            <div class="col-md-8 animate-fade-up-1">
                <div class="book-info-card">

                    <!-- Category badge -->
                    <div th:if="${book.category != null}" class="mb-2">
                        <span class="badge" th:text="${book.category.categoryName}">Category</span>
                    </div>

                    <h2 th:text="${book.title}">Title</h2>
                    <p class="author">
                        <i class="bi bi-person-fill me-1" style="color:var(--clr-accent-3);"></i>
                        <span th:text="${book.author}">Author</span>
                    </p>

                    <div class="book-price mb-3"
                         th:text="${book.price != null ? '$' + book.price : 'Free'}">$0</div>

                    <p class="description" th:text="${book.description}">Description</p>

                    <!-- Actions: only for logged-in users -->
                    <div sec:authorize="isAuthenticated()" class="mt-4 d-flex flex-wrap gap-2">
                        <a th:if="${book.filePath != null}"
                           th:href="@{/books/read/{id}(id=${book.id})}"
                           target="_blank"
                           class="btn btn-success"
                           id="readOnlineBtn">
                            <i class="bi bi-eye me-2"></i>Read Online
                        </a>
                        <a th:if="${book.filePath != null}"
                           th:href="@{/books/download/{id}(id=${book.id})}"
                           class="btn btn-primary"
                           id="downloadBtn">
                            <i class="bi bi-download me-2"></i>Download
                        </a>

                        <!-- Add / Remove from collection -->
                        <form th:unless="${inCollection}" class="d-inline"
                              th:action="@{/collection/add/{id}(id=${book.id})}" method="post">
                            <button class="btn btn-outline-danger" type="submit" id="addCollectionBtn">
                                <i class="bi bi-heart me-2"></i>Add to Collection
                            </button>
                        </form>
                        <form th:if="${inCollection}" class="d-inline"
                              th:action="@{/collection/remove/{id}(id=${book.id})}" method="post">
                            <button class="btn btn-danger" type="submit" id="removeCollectionBtn">
                                <i class="bi bi-heart-fill me-2"></i>In My Collection
                            </button>
                        </form>

                        <!-- No file uploaded -->
                        <div th:if="${book.filePath == null}" class="alert alert-warning d-flex align-items-center gap-2 mt-2" style="width:100%;">
                            <i class="bi bi-file-earmark-x-fill"></i>
                            No file uploaded for this book yet.
                        </div>
                    </div>

                    <!-- Prompt to log in -->
                    <div sec:authorize="!isAuthenticated()" class="mt-4">
                        <div class="alert alert-info d-flex align-items-center gap-2">
                            <i class="bi bi-info-circle-fill" style="font-size:1.2rem; flex-shrink:0;"></i>
                            <span>
                                Please <a th:href="@{/login}" style="color:#67e8f9; font-weight:600;">log in</a>
                                to read, download, or save this book to your collection.
                            </span>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <a th:href="@{/login}" class="btn btn-primary" id="detailsLoginBtn">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </a>
                            <a th:href="@{/register}" class="btn btn-outline-primary" id="detailsRegisterBtn">
                                <i class="bi bi-person-plus me-2"></i>Register Free
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Back link -->
        <div class="mt-4">
            <a th:href="@{/books}" class="btn btn-secondary" id="backToBooksBtn">
                <i class="bi bi-arrow-left me-2"></i>Back to Books
            </a>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scrollTop}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
