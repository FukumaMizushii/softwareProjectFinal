<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('Category Form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 600px;">
    <h3 th:text="${editMode} ? 'Edit Category' : 'Add Category'">Category Form</h3>

    <form th:action="${editMode}
                     ? @{/admin/categories/edit/{id}(id=${categoryDto.id})}
                     : @{/admin/categories/add}"
          th:object="${categoryDto}" method="post"
          class="card p-4 mt-3 bg-white shadow-sm">

        <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input type="text" th:field="*{categoryName}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('categoryName')}"
                 th:errors="*{categoryName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/admin/categories}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
