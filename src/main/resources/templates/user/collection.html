<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('My Collection - BookVault')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- Page header -->
<div style="padding:2.5rem 0 1rem; background:linear-gradient(180deg, rgba(236,72,153,0.07) 0%, transparent 100%);">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h2 class="section-heading mb-1">My Collection</h2>
                <p class="text-muted small mb-0" th:unless="${#lists.isEmpty(books)}"
                   th:text="${books.size()} + ' book(s) saved'"></p>
            </div>

            <!-- COMMAND pattern: undo the last add/remove action -->
            <form th:if="${canUndo}" th:action="@{/collection/undo}" method="post">
                <button class="btn btn-outline-secondary btn-sm" type="submit" id="undoBtn">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Undo last change
                </button>
            </form>
        </div>
    </div>
</div>

<div class="container mt-4 mb-5">

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(books)}" class="empty-state">
        <i class="bi bi-bookmark-heart"></i>
        <h5>Your collection is empty</h5>
        <p>Start discovering books and save your favorites here.</p>
        <a th:href="@{/books}" class="btn btn-primary mt-2" id="browseFromCollectionBtn">
            <i class="bi bi-grid me-2"></i>Browse Books
        </a>
    </div>

    <!-- Book grid -->
    <div class="row g-4">
        <div class="col-sm-6 col-md-4 col-lg-3" th:each="book : ${books}">
            <div class="card book-card">
                <a th:href="@{/books/{id}(id=${book.id})}" class="book-cover-wrapper d-block">
                    <img th:if="${book.coverImagePath != null}"
                         th:src="@{/covers/{name}(name=${#strings.replace(book.coverImagePath,'covers/','')})}"
                         class="book-cover" alt="cover">
                    <div th:unless="${book.coverImagePath != null}" class="book-cover-placeholder">
                        <i class="bi bi-book"></i>
                    </div>
                    <!-- Collection heart badge -->
                    <div style="position:absolute; top:10px; right:10px; z-index:2;
                                width:32px; height:32px; border-radius:50%;
                                background:rgba(236,72,153,0.25); border:1px solid rgba(236,72,153,0.4);
                                display:flex; align-items:center; justify-content:center;
                                backdrop-filter:blur(10px);">
                        <i class="bi bi-heart-fill" style="color:#f472b6; font-size:0.8rem;"></i>
                    </div>
                </a>
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title mb-1" th:text="${book.title}">Title</h6>
                    <p class="text-muted small mb-3" th:text="'by ' + ${book.author}">Author</p>
                    <div class="mt-auto d-flex gap-2">
                        <a th:href="@{/books/{id}(id=${book.id})}"
                           class="btn btn-view flex-grow-1">
                            <i class="bi bi-eye me-1"></i>View
                        </a>
                        <form class="d-inline"
                              th:action="@{/collection/remove/{id}(id=${book.id})}" method="post">
                            <button class="btn btn-outline-danger btn-sm"
                                    type="submit"
                                    style="height:100%; padding:0 0.75rem;"
                                    title="Remove from collection">
                                <i class="bi bi-heart-slash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scrollTop}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
