<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <h3>Admin Dashboard</h3>

    <div class="row g-4 mt-1">
        <div class="col-md-4">
            <div class="card dashboard-stat stat-books p-4 text-center">
                <i class="bi bi-book fs-1"></i>
                <h2 th:text="${bookCount}">0</h2>
                <p class="mb-0">Books</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-stat stat-categories p-4 text-center">
                <i class="bi bi-tags fs-1"></i>
                <h2 th:text="${categoryCount}">0</h2>
                <p class="mb-0">Categories</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-stat stat-users p-4 text-center">
                <i class="bi bi-people fs-1"></i>
                <h2 th:text="${userCount}">0</h2>
                <p class="mb-0">Users</p>
            </div>
        </div>
    </div>

    <div class="card mt-4 p-4">
        <h5>Management</h5>
        <div class="d-flex flex-wrap gap-2 mt-2">
            <a th:href="@{/admin/books}" class="btn btn-outline-primary">Manage Books</a>
            <a th:href="@{/admin/books/add}" class="btn btn-outline-success">Add Book</a>
            <a th:href="@{/admin/categories}" class="btn btn-outline-primary">Manage Categories</a>
            <a th:href="@{/admin/users}" class="btn btn-outline-primary">Manage Users</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
