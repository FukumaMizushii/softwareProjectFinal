# ===============================
# = SERVER
# ===============================
server.port=8080

# ===============================
# = MYSQL DATABASE CONNECTION
# ===============================
# Make sure a database named "ebook_management_system" exists (see Database setup section).
# createDatabaseIfNotExist=true will auto-create it for you on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/ebook_management_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
# "update" keeps the schema in sync with entities without dropping data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# = FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Base folder (relative to project root) where uploaded files are stored.
# The database stores only the relative path, never the binary.
file.upload-dir=uploads

# ===============================
# = THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# = SEED ADMIN ACCOUNT (used by DataInitializer)
# ===============================
app.admin.email=admin@ebook.com
app.admin.password=admin123
app.admin.name=System Administrator
