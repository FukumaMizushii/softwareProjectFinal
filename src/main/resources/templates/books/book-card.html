<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Reusable book card. Pass a Book object as 'book'. -->
<div th:fragment="card(book)" class="card book-card">

    <!-- Cover image wrapper with shimmer effect -->
    <a th:href="@{/books/{id}(id=${book.id})}" class="book-cover-wrapper d-block">
        <img th:if="${book.coverImagePath != null}"
             th:src="@{/covers/{name}(name=${#strings.replace(book.coverImagePath,'covers/','')})}"
             class="book-cover" alt="cover">
        <div th:unless="${book.coverImagePath != null}" class="book-cover-placeholder">
            <i class="bi bi-book"></i>
        </div>

        <!-- Category badge overlay on cover -->
        <div th:if="${book.category != null}"
             style="position:absolute; top:10px; left:10px; z-index:2;">
            <span class="badge" th:text="${book.category.categoryName}">Category</span>
        </div>
    </a>

    <div class="card-body d-flex flex-column">
        <h6 class="card-title mb-1" th:text="${book.title}">Title</h6>
        <p class="text-muted small mb-2" th:text="'by ' + ${book.author}">Author</p>

        <p class="price-tag mb-3"
           th:text="${book.price != null ? '$' + book.price : 'Free'}">$0</p>

        <a th:href="@{/books/{id}(id=${book.id})}"
           class="btn btn-view mt-auto">
            <i class="bi bi-eye me-1"></i>View Details
        </a>
    </div>
</div>

</body>
</html>
