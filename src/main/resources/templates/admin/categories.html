<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('Manage Categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h3>Manage Categories</h3>
        <a th:href="@{/admin/categories/add}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Add Category
        </a>
    </div>

    <div th:if="${#lists.isEmpty(categories)}" class="alert alert-info mt-3">No categories yet.</div>

    <div class="table-responsive mt-3" th:unless="${#lists.isEmpty(categories)}">
        <table class="table table-hover align-middle bg-white">
            <thead class="table-dark">
            <tr><th>#</th><th>Name</th><th>Description</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categories}">
                <td th:text="${cat.id}">1</td>
                <td th:text="${cat.categoryName}">Name</td>
                <td th:text="${cat.description}">Desc</td>
                <td class="text-end">
                    <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
                       class="btn btn-sm btn-outline-primary">Edit</a>
                    <form class="d-inline" th:action="@{/admin/categories/delete/{id}(id=${cat.id})}"
                          method="post" onsubmit="return confirm('Delete this category?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
