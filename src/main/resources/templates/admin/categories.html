<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('Manage Categories - BookVault')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4 mb-5">

    <div class="admin-header animate-fade-up">
        <div>
            <h3><i class="bi bi-tags-fill me-2" style="color:#f97316;"></i>Manage Categories</h3>
            <p style="color:var(--clr-text-muted); font-size:0.85rem; margin:0;">
                Organise your library by topic
            </p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Dashboard
            </a>
            <a th:href="@{/admin/categories/add}" class="btn btn-success" id="addCategoryBtn">
                <i class="bi bi-plus-lg me-1"></i>Add Category
            </a>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(categories)}" class="empty-state animate-fade-up-1">
        <i class="bi bi-tags"></i>
        <h5>No categories yet</h5>
        <p>Create your first category to organise books.</p>
        <a th:href="@{/admin/categories/add}" class="btn btn-success mt-2">
            <i class="bi bi-plus-lg me-1"></i>Add First Category
        </a>
    </div>

    <div class="table-responsive mt-3 animate-fade-up-1" th:unless="${#lists.isEmpty(categories)}">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Category Name</th>
                <th>Description</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categories}">
                <td style="color:var(--clr-text-muted); font-size:0.8rem;" th:text="${cat.id}">1</td>
                <td>
                    <div class="d-flex align-items-center gap-2">
                        <span style="width:8px; height:8px; border-radius:50%;
                                     background:linear-gradient(135deg,#f97316,#f59e0b);
                                     display:inline-block; flex-shrink:0;"></span>
                        <span style="font-weight:600;" th:text="${cat.categoryName}">Name</span>
                    </div>
                </td>
                <td style="color:var(--clr-text-muted); font-size:0.9rem; max-width:300px;"
                    th:text="${cat.description}">Desc</td>
                <td class="text-end">
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <form class="d-inline" th:action="@{/admin/categories/delete/{id}(id=${cat.id})}"
                              method="post" onsubmit="return confirm('Delete this category?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">
                                <i class="bi bi-trash me-1"></i>Delete
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="text-muted small mt-2 text-end" th:unless="${#lists.isEmpty(categories)}"
       th:text="${categories.size()} + ' categories total'"></p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scrollTop}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
