<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Reusable book card. Pass a Book object as 'book'. -->
<div th:fragment="card(book)" class="card book-card shadow-sm">

    <!-- Cover image, or a gradient placeholder if none uploaded -->
    <a th:href="@{/books/{id}(id=${book.id})}">
        <img th:if="${book.coverImagePath != null}"
             th:src="@{/covers/{name}(name=${#strings.replace(book.coverImagePath,'covers/','')})}"
             class="card-img-top book-cover" alt="cover">
        <div th:unless="${book.coverImagePath != null}" class="book-cover-placeholder">
            <i class="bi bi-book"></i>
        </div>
    </a>

    <div class="card-body d-flex flex-column">
        <h6 class="card-title mb-1" th:text="${book.title}">Title</h6>
        <p class="text-muted small mb-2" th:text="'by ' + ${book.author}">Author</p>
        <span th:if="${book.category != null}"
              class="badge bg-secondary mb-2 align-self-start"
              th:text="${book.category.categoryName}">Category</span>
        <p class="mb-3 fw-bold text-primary"
           th:text="${book.price != null ? '$' + book.price : 'Free'}">$0</p>
        <a th:href="@{/books/{id}(id=${book.id})}"
           class="btn btn-sm btn-primary mt-auto">View Details</a>
    </div>
</div>

</body>
</html>
