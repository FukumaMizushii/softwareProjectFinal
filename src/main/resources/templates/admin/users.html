<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead('Manage Users - BookVault')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4 mb-5">

    <div class="admin-header animate-fade-up">
        <div>
            <h3><i class="bi bi-people-fill me-2" style="color:#0ea5e9;"></i>Manage Users</h3>
            <p style="color:var(--clr-text-muted); font-size:0.85rem; margin:0;">
                View and manage registered accounts
            </p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Dashboard
        </a>
    </div>

    <div class="table-responsive mt-3 animate-fade-up-1">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td style="color:var(--clr-text-muted); font-size:0.8rem;" th:text="${u.id}">1</td>
                <td>
                    <div class="d-flex align-items-center gap-2">
                        <!-- User avatar initial -->
                        <div th:text="${#strings.substring(u.name, 0, 1).toUpperCase()}"
                             style="width:32px; height:32px; border-radius:50%;
                                    background:linear-gradient(135deg,#7c3aed,#3b82f6);
                                    display:flex; align-items:center; justify-content:center;
                                    font-size:0.8rem; font-weight:700; color:#fff;
                                    flex-shrink:0;">U</div>
                        <span style="font-weight:500;" th:text="${u.name}">Name</span>
                    </div>
                </td>
                <td style="color:var(--clr-text-muted); font-size:0.9rem;" th:text="${u.email}">email</td>
                <td style="color:var(--clr-text-muted); font-size:0.9rem;"
                    th:text="${u.phone} ?: '—'">phone</td>
                <td>
                    <span class="badge"
                          th:classappend="${u.role.name() == 'ADMIN'} ? 'badge-role-admin' : 'badge-role-user'"
                          th:text="${u.role}">ROLE</span>
                </td>
                <td class="text-end">
                    <form class="d-inline" th:action="@{/admin/users/delete/{id}(id=${u.id})}"
                          method="post" onsubmit="return confirm('Delete this user?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit"
                                th:disabled="${u.role.name() == 'ADMIN'}"
                                title="Delete user">
                            <i class="bi bi-trash me-1"></i>Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="text-muted small mt-2 text-end" th:text="${users.size()} + ' users total'"></p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scrollTop}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
