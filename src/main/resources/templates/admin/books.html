<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Books')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h3>Manage Books</h3>
        <a th:href="@{/admin/books/add}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Add Book
        </a>
    </div>

    <!-- PROTOTYPE pattern: start a new book by cloning a master template -->
    <div class="card p-3 my-3 bg-white shadow-sm">
        <h6 class="mb-2">Quick add from a template (Prototype pattern)</h6>
        <div class="d-flex flex-wrap gap-2">
            <a th:each="t : ${templates}"
               th:href="@{/admin/books/add-from-template/{key}(key=${t.key})}"
               class="btn btn-sm btn-outline-primary"
               th:text="${t.key}">template-key</a>
        </div>
        <!-- ADAPTER pattern: import a sample book that is in the legacy format -->
        <form th:action="@{/admin/books/import-legacy}" method="post" class="mt-3">
            <button class="btn btn-sm btn-outline-warning" type="submit">
                Import legacy sample book (Adapter pattern)
            </button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(books)}" class="alert alert-info mt-3">
        No books yet.
    </div>

    <div class="table-responsive mt-3" th:unless="${#lists.isEmpty(books)}">
        <table class="table table-hover align-middle bg-white">
            <thead class="table-dark">
            <tr>
                <th>#</th><th>Title</th><th>Author</th><th>Category</th>
                <th>Price</th><th>File</th><th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>
                <td th:text="${book.title}">Title</td>
                <td th:text="${book.author}">Author</td>
                <td th:text="${book.category != null ? book.category.categoryName : '-'}">Cat</td>
                <td th:text="${book.price != null ? '$' + book.price : 'Free'}">$0</td>
                <td>
                    <span th:if="${book.filePath != null}" class="badge bg-success">Yes</span>
                    <span th:unless="${book.filePath != null}" class="badge bg-secondary">No</span>
                </td>
                <td class="text-end">
                    <a th:href="@{/admin/books/edit/{id}(id=${book.id})}"
                       class="btn btn-sm btn-outline-primary">Edit</a>
                    <form class="d-inline" th:action="@{/admin/books/delete/{id}(id=${book.id})}"
                          method="post" onsubmit="return confirm('Delete this book?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
